# Generates a commit activity summary and contributor stats, then commits
# the report to docs/ACTIVITY.md so it's always browsable on GitHub.
# Runs weekly and on-demand.
#
name: "Repository Activity"

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  activity-report:
    name: Generate Activity Report
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for accurate stats

    - name: Generate commit activity summary
      shell: bash
      run: |
        mkdir -p docs

        {
          echo "# Repository Activity Report"
          echo ""
          echo "> Auto-generated by [repo-activity.yml](../.github/workflows/repo-activity.yml) — updated weekly."
          echo ""
          echo "**Generated:** $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo ""

          echo "## Commit Activity"
          echo ""
          echo "| Period | Commits |"
          echo "|--------|---------|"

          LAST_7=$(git rev-list --count --since="7 days ago" HEAD)
          LAST_30=$(git rev-list --count --since="30 days ago" HEAD)
          LAST_90=$(git rev-list --count --since="90 days ago" HEAD)
          TOTAL=$(git rev-list --count HEAD)

          echo "| Last 7 days | $LAST_7 |"
          echo "| Last 30 days | $LAST_30 |"
          echo "| Last 90 days | $LAST_90 |"
          echo "| All time | $TOTAL |"
          echo ""

          echo "## Contributors"
          echo ""
          echo "| Author | Commits (90d) | Commits (all) |"
          echo "|--------|---------------|---------------|"

          git log --since="90 days ago" --format='%aN' | sort | uniq -c | sort -rn | while read count name; do
            all_count=$(git log --format='%aN' --author="$name" | wc -l)
            echo "| $name | $count | $all_count |"
          done

          echo ""
          echo "## Recent Commits (Last 30 Days)"
          echo ""
          git log --since="30 days ago" --format="- **%ad** %s (%aN)" --date=short
          echo ""

          echo "## Source Lines of Code"
          echo ""
          echo "| Language | Files | Lines |"
          echo "|----------|-------|-------|"

          # Count project source (exclude vendored third-party)
          CPP_FILES=$(find UnrealFolder/ProjectMobius/Source -name "*.cpp" -o -name "*.h" 2>/dev/null | wc -l)
          CPP_LINES=$(find UnrealFolder/ProjectMobius/Source -name "*.cpp" -o -name "*.h" 2>/dev/null -exec cat {} + | wc -l)
          echo "| C++ (Source/) | $CPP_FILES | $CPP_LINES |"

          CMAKE_FILES=$(find UnrealFolder/ProjectMobius -maxdepth 2 -name "CMakeLists.txt" 2>/dev/null | wc -l)
          CMAKE_LINES=$(find UnrealFolder/ProjectMobius -maxdepth 2 -name "CMakeLists.txt" 2>/dev/null -exec cat {} + | wc -l)
          echo "| CMake | $CMAKE_FILES | $CMAKE_LINES |"

          CS_FILES=$(find UnrealFolder/ProjectMobius/Source -name "*.cs" 2>/dev/null | wc -l)
          CS_LINES=$(find UnrealFolder/ProjectMobius/Source -name "*.cs" 2>/dev/null -exec cat {} + | wc -l)
          echo "| C# (Build scripts) | $CS_FILES | $CS_LINES |"
        } > docs/ACTIVITY.md

        cat docs/ACTIVITY.md
        echo ""
        echo "--- Activity report generated successfully ---"

    - name: Upload activity report artifact
      uses: actions/upload-artifact@v4
      with:
        name: activity-report
        path: docs/ACTIVITY.md
        retention-days: 90

    - name: Commit activity report
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git add docs/ACTIVITY.md

        # Only commit if the file actually changed
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update activity report [skip ci]"
          git push
        fi
