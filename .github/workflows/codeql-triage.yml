# Broader CodeQL triage workflow for scheduled and manual review.
#
# This runs security-and-quality to surface maintainability and reliability
# findings without uploading them into the main Code Scanning alert stream.
#
name: "CodeQL Triage"

on:
  workflow_dispatch:
  schedule:
    - cron: '24 0 * * 4'

jobs:
  analyze:
    name: Triage (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: c-cpp
          build-mode: none
        - language: javascript-typescript
          build-mode: none
        - language: python
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: security-and-quality
        config-file: ./.github/codeql-config.yml

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}/triage"
        output: codeql-results
        upload: failure-only

    - name: Upload triage SARIF artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: codeql-triage-${{ matrix.language }}
        path: codeql-results
        if-no-files-found: warn
        retention-days: 14
