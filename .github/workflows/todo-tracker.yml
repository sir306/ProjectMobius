# TODO Tracker — scans source for TODO/FIXME/HACK/XXX comments and commits
# a summary to docs/TECH-DEBT.md. Runs weekly and on-demand.
#
name: "TODO Tracker"

on:
  schedule:
    # Every Monday at 06:30 UTC (after activity report)
    - cron: '30 6 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'UnrealFolder/ProjectMobius/Source/**/*.h'
      - 'UnrealFolder/ProjectMobius/Source/**/*.cpp'

jobs:
  track-todos:
    name: Scan TODOs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Generate tech debt report
      shell: bash
      run: |
        mkdir -p docs
        SOURCE_DIR="UnrealFolder/ProjectMobius/Source"

        {
          echo "# Tech Debt Tracker"
          echo ""
          echo "> Auto-generated by [todo-tracker.yml](../.github/workflows/todo-tracker.yml) — updated weekly and on source changes."
          echo ""
          echo "**Generated:** $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo ""

          # Count by tag
          TODO_COUNT=$(grep -rn "TODO" "$SOURCE_DIR" --include="*.h" --include="*.cpp" --exclude-dir=ThirdParty 2>/dev/null | wc -l)
          FIXME_COUNT=$(grep -rn "FIXME" "$SOURCE_DIR" --include="*.h" --include="*.cpp" --exclude-dir=ThirdParty 2>/dev/null | wc -l)
          HACK_COUNT=$(grep -rn "HACK" "$SOURCE_DIR" --include="*.h" --include="*.cpp" --exclude-dir=ThirdParty 2>/dev/null | wc -l)
          XXX_COUNT=$(grep -rn "XXX" "$SOURCE_DIR" --include="*.h" --include="*.cpp" --exclude-dir=ThirdParty 2>/dev/null | wc -l)
          WORKAROUND_COUNT=$(grep -rn "WORKAROUND" "$SOURCE_DIR" --include="*.h" --include="*.cpp" --exclude-dir=ThirdParty 2>/dev/null | wc -l)
          TOTAL=$((TODO_COUNT + FIXME_COUNT + HACK_COUNT + XXX_COUNT + WORKAROUND_COUNT))

          echo "## Summary"
          echo ""
          echo "| Tag | Count |"
          echo "|-----|-------|"
          echo "| \`TODO\` | $TODO_COUNT |"
          echo "| \`FIXME\` | $FIXME_COUNT |"
          echo "| \`HACK\` | $HACK_COUNT |"
          echo "| \`XXX\` | $XXX_COUNT |"
          echo "| \`WORKAROUND\` | $WORKAROUND_COUNT |"
          echo "| **Total** | **$TOTAL** |"
          echo ""

          # Breakdown by module
          echo "## By Module"
          echo ""
          echo "| Module | TODO | FIXME | HACK | Total |"
          echo "|--------|------|-------|------|-------|"

          for module_dir in "$SOURCE_DIR"/*/; do
            module=$(basename "$module_dir")
            m_todo=$(grep -rn "TODO" "$module_dir" --include="*.h" --include="*.cpp" --exclude-dir=ThirdParty 2>/dev/null | wc -l)
            m_fixme=$(grep -rn "FIXME" "$module_dir" --include="*.h" --include="*.cpp" --exclude-dir=ThirdParty 2>/dev/null | wc -l)
            m_hack=$(grep -rn "HACK" "$module_dir" --include="*.h" --include="*.cpp" --exclude-dir=ThirdParty 2>/dev/null | wc -l)
            m_total=$((m_todo + m_fixme + m_hack))
            if [[ $m_total -gt 0 ]]; then
              echo "| $module | $m_todo | $m_fixme | $m_hack | $m_total |"
            fi
          done

          echo ""

          # Full listing grouped by file
          echo "## All Items"
          echo ""

          for tag in TODO FIXME HACK XXX WORKAROUND; do
            matches=$(grep -rn "$tag" "$SOURCE_DIR" --include="*.h" --include="*.cpp" --exclude-dir=ThirdParty 2>/dev/null || true)
            if [[ -n "$matches" ]]; then
              echo "### $tag"
              echo ""

              current_file=""
              while IFS= read -r match; do
                # Parse file:line:content
                file=$(echo "$match" | cut -d: -f1)
                line_num=$(echo "$match" | cut -d: -f2)
                content=$(echo "$match" | cut -d: -f3- | sed 's/^[[:space:]]*//' | head -c 200)

                # Strip Source dir prefix for readability
                short_file="${file#$SOURCE_DIR/}"

                if [[ "$file" != "$current_file" ]]; then
                  current_file="$file"
                  echo "**$short_file**"
                fi
                echo "- Line $line_num: \`$content\`"
              done <<< "$matches"
              echo ""
            fi
          done

        } > docs/TECH-DEBT.md

        echo "Tech debt report generated: $TOTAL items found"
        cat docs/TECH-DEBT.md

    - name: Commit tech debt report
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git add docs/TECH-DEBT.md

        # Only commit if the file actually changed
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update tech debt report [skip ci]"
          git push
        fi
