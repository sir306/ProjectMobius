# C++ Style Check — clang-format, UE naming conventions, and license headers
#
# Runs on pushes/PRs to main that touch Source/**/*.{h,cpp}.
# Currently warn-only; switch to enforcing after a format-all commit.

name: "C++ Style"

on:
  push:
    branches: [main]
    paths:
      - 'UnrealFolder/ProjectMobius/Source/**/*.h'
      - 'UnrealFolder/ProjectMobius/Source/**/*.cpp'
  pull_request:
    branches: [main]
    paths:
      - 'UnrealFolder/ProjectMobius/Source/**/*.h'
      - 'UnrealFolder/ProjectMobius/Source/**/*.cpp'

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install clang-format-18
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq clang-format-18

    - name: Run clang-format check
      shell: bash
      run: |
        ERRORS=0

        # Find all .h/.cpp files under Source/, excluding ThirdParty
        while IFS= read -r -d '' file; do
          # Run clang-format in dry-run mode and capture diff
          if ! diff_output=$(clang-format-18 \
            --style=file:"UnrealFolder/ProjectMobius/.clang-format" \
            --dry-run --Werror "$file" 2>&1); then
            ERRORS=$((ERRORS + 1))
            # Emit GitHub annotation
            echo "::warning file=${file}::clang-format would reformat this file"
          fi
        done < <(find UnrealFolder/ProjectMobius/Source \
          \( -name "*.h" -o -name "*.cpp" \) \
          -not -path "*/ThirdParty/*" \
          -print0)

        echo ""
        if [[ $ERRORS -eq 0 ]]; then
          echo "clang-format: all files are correctly formatted"
        else
          echo "clang-format: $ERRORS file(s) would be reformatted"
          echo ""
          echo "To fix locally, run:"
          echo "  find UnrealFolder/ProjectMobius/Source \\( -name '*.h' -o -name '*.cpp' \\) -not -path '*/ThirdParty/*' -exec clang-format-18 --style=file:UnrealFolder/ProjectMobius/.clang-format -i {} +"
        fi

        # Warn-only for now — uncomment the next line to enforce:
        # exit $( [[ $ERRORS -gt 0 ]] && echo 1 || echo 0 )
        exit 0

  ue-naming:
    name: UE Naming Conventions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check UE naming conventions
      shell: bash
      run: |
        # Warn-only for now; set STRICT=1 to enforce
        bash .github/scripts/check-ue-naming.sh

  license-header:
    name: License Headers
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check license headers
      shell: bash
      run: |
        # Warn-only for now; set STRICT=1 to enforce
        bash .github/scripts/check-license-header.sh
