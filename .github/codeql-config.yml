name: "ProjectMobius CodeQL Config"

# Exclude vendored and generated code from analysis.
# These directories contain upstream library sources or generated documentation
# that inflate result sets and are not maintained as first-party code.
paths-ignore:
  - '**/ThirdParty/**'
  - 'ASSIMP_5.4.3/**'
  - 'UnrealFolder/ProjectMobius/_superbuild/**'
  - 'UnrealFolder/ProjectMobius/Intermediate/**'
  - 'UnrealFolder/ProjectMobius/Plugins/UE4_Assimp/docs/**'
  - 'ImportedOpenSourceAssets/**'
  - 'ThirdParty/**'

# MistypedFunctionArguments.ql produces a result set exceeding 2 GiB even
# after path exclusions, because UE macro-heavy code generates enormous
# numbers of matches.  Excluding it lets the remaining 180 queries run
# cleanly.
query-filters:
  - exclude:
      id: cpp/mistyped-function-arguments
