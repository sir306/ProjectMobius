; Project defaults for the custom GameUserSettings class (MobiusCore.UserProjectSettings).
; The engine resolves this section name from GameUserSettingsClassName in DefaultEngine.ini.
; Version=5 (UE_GAMEUSERSETTINGS_VERSION) is required — PreloadResolutionSettings ignores
; the saved/default resolution when the version does not match.
; These values are the FIRST-RUN fallback only; ProjectMobiusGameInstance::OnStart sizes the
; window to the current monitor work area on first launch, and user changes persist to
; Saved/Config/.../GameUserSettings.ini thereafter.

[/Script/MobiusCore.UserProjectSettings]
ResolutionSizeX=1280
ResolutionSizeY=720
LastUserConfirmedResolutionSizeX=1280
LastUserConfirmedResolutionSizeY=720
FullscreenMode=2
LastConfirmedFullscreenMode=2
Version=5
