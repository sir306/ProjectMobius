[/Script/UnrealEd.ProjectPackagingSettings]
; The Windows beta is published publicly too, so it ships without the sample datasets
; DefaultGame.ini stages (third-party trajectories and test models whose redistribution terms are
; not ours to grant: Simulex output, a JuPedSim FBX, ISO-Test-8 fixtures, and the Juelich
; trajectory research data under Hdf5TestData).
; This mirrors Config/Mac/MacGame.ini. The entries stay in DefaultGame.ini so an editor or
; internal build still gets them; only the staged package drops them.
-DirectoriesToAlwaysStageAsNonUFS=(Path="../UnitTestSampleData")
-DirectoriesToAlwaysStageAsNonUFS=(Path="../Plugins/MobiusDataImporter/Hdf5TestData")
