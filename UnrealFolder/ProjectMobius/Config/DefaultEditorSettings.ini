[/Script/UnrealEd.EditorPerformanceSettings]
; Keep the editor rendering at full rate when it is not the foreground window.
;
; Mobius is driven from outside the editor a lot -- capture scripts, automation, and timing runs all take
; focus away from it. With the default (True) the editor throttles to a few FPS the moment focus moves,
; which does two concrete kinds of damage:
;   1. Synthetic input is dropped. Below ~10 FPS the editor discards injected clicks, so UI automation
;      silently does nothing and reads as "the button does not work".
;   2. Any frame-time or latency measurement taken while focus is elsewhere is meaningless.
;
; The companion CVar t.IdleWhenNotForeground=0 is already set in Config/ConsoleVariables.ini. That one
; alone is NOT enough: it governs engine idling, while this governs the editor's own CPU throttle, and
; they are independent. Both are needed.
;
; This lives in a *project* config on purpose. UEditorPerformanceSettings is config=EditorSettings, i.e.
; per-user, so setting it through Editor Preferences only writes it into that machine's
; Saved/Config/.../EditorSettings.ini and it is lost on a clean checkout or a move to another machine.
bThrottleCPUWhenNotForeground=False
